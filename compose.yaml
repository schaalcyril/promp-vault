services:
  api:
    build: ./backend
    environment:
      APP_CONFIG_FILE: /etc/prompt-vault/application.json
    restart: 'no'
    mem_limit: 4g
    read_only: true
    tmpfs:
    - /tmp:size=64m
    security_opt:
    - no-new-privileges:true
    cap_drop:
    - ALL
    volumes:
    - type: bind
      source: ./config/application.local.json
      target: /etc/prompt-vault/application.json
      read_only: true
      bind:
        create_host_path: false
  web:
    build: ./frontend
    ports:
    - 127.0.0.1:3080:80
    depends_on:
    - api
