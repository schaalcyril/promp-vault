apiVersion: v1
kind: Service
metadata:
  name: prompt-vault-api
  namespace: prompt-vault
spec:
  selector:
    app: prompt-vault-api
  ports:
  - name: http
    port: 8000
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: prompt-vault-web
  namespace: prompt-vault
spec:
  selector:
    app: prompt-vault-web
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prompt-vault-api
  namespace: prompt-vault
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prompt-vault-api
  template:
    metadata:
      labels:
        app: prompt-vault-api
      annotations:
        prompt-vault/pipeline: "${CI_PIPELINE_ID}"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 630
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 10001
      containers:
      - name: api
        image: ${CI_REGISTRY_IMAGE}/api:${CI_COMMIT_SHA}
        ports:
        - name: http
          containerPort: 8000
        env:
        - name: APP_CONFIG_FILE
          value: /etc/prompt-vault/application.json
        - name: PYTHONDONTWRITEBYTECODE
          value: '1'
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: '2'
            memory: 4Gi
        startupProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 10
          failureThreshold: 60
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 30
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          periodSeconds: 10
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: application
          mountPath: /etc/prompt-vault/application.json
          subPath: application.json
          readOnly: true
      volumes:
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
      - name: application
        configMap:
          name: prompt-vault-config
      imagePullSecrets:
      - name: gitlab-registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prompt-vault-web
  namespace: prompt-vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prompt-vault-web
  template:
    metadata:
      labels:
        app: prompt-vault-web
      annotations:
        prompt-vault/pipeline: "${CI_PIPELINE_ID}"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web
        image: ${CI_REGISTRY_IMAGE}/web:${CI_COMMIT_SHA}
        command:
        - nginx
        - -g
        - daemon off;
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
        volumeMounts:
        - name: config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        configMap:
          name: prompt-vault-nginx
      - name: tmp
        emptyDir:
          sizeLimit: 128Mi
      imagePullSecrets:
      - name: gitlab-registry
