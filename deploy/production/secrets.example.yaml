# Exemple uniquement : fournir un vrai salt/hash scrypt généré hors Git.
# Aucun mot de passe en clair ; le fichier ne doit pas être appliqué tel quel.
apiVersion: v1
kind: Secret
metadata:
  name: prompt-vault-superadmin
  namespace: prompt-vault
type: Opaque
stringData:
  superadmin.json: |
    {"salt":"REMPLACER_PAR_64_CARACTERES_HEXA","hash":"REMPLACER_PAR_128_CARACTERES_HEXA"}
