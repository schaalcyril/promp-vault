# Instance de test uniquement : base embarquée éphémère, réimport à chaque nouveau pod.
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: prompt-vault
spec:
  selector:
    app: keycloak-local
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak-local
  namespace: prompt-vault
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak-local
  template:
    metadata:
      labels:
        app: keycloak-local
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.0
          args: [start-dev, --import-realm]
          env:
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: keycloak-admin
            - name: KC_HOSTNAME
              value: https://prompt-vault.home.arpa/auth
            - name: KC_HTTP_RELATIVE_PATH
              value: /auth
            - name: KC_HTTP_ENABLED
              value: 'true'
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HEALTH_ENABLED
              value: 'true'
            - name: KC_HTTP_MANAGEMENT_RELATIVE_PATH
              value: /
          envFrom:
            - secretRef:
                name: keycloak-local-credentials
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: '2'
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /health/ready
              port: management
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: management
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /opt/keycloak/data
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: realm
          configMap:
            name: keycloak-local-realm
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak-local
  namespace: prompt-vault
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts: [prompt-vault.home.arpa]
      secretName: prompt-vault-local-tls
  rules:
    - host: prompt-vault.home.arpa
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
