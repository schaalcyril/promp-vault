server {
 listen 80;
 resolver 127.0.0.11 valid=10s ipv6=off;
 root /usr/share/nginx/html;
 client_max_body_size 61m;
 access_log off;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
 add_header X-Content-Type-Options nosniff always;
 location /api/ {
  set $api_backend api:8000;
  proxy_pass http://$api_backend;
  proxy_request_buffering off;
  proxy_buffering off;
  proxy_read_timeout 600s;
 }
 location / { try_files $uri /index.html; }
}
